name: Build

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gadgetsme_network

      - name: Checkout Building Gadgets 2
        uses: actions/checkout@v4
        with:
          repository: Direwolf20-MC/BuildingGadgets2
          path: BuildingGadgets2

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle (BG2)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build Building Gadgets 2
        working-directory: BuildingGadgets2
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Copy BG2 jar to libs
        run: |
          mkdir -p gadgetsme_network/libs
          cp BuildingGadgets2/build/libs/buildinggadgets2-*.jar gadgetsme_network/libs/

      - name: Download Curios jar
        run: |
          curl -Lo gadgetsme_network/libs/curios-neoforge-9.5.1+1.21.1.jar \
            "https://maven.theillusivec4.top/top/theillusivec4/curios/curios-neoforge/9.5.1+1.21.1/curios-neoforge-9.5.1+1.21.1.jar"

      - name: Setup Gradle (GadgetsME Network)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build GadgetsME Network
        working-directory: gadgetsme_network
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gadgetsme_network
          path: gadgetsme_network/build/libs/gadgetsme_network-*.jar

  release:
    if: startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: gadgetsme_network

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: GadgetsME Network ${{ github.ref_name }}
          body: |
            See [CHANGELOG](CHANGELOG.md) for details.
          files: gadgetsme_network-*.jar
          generate_release_notes: true
