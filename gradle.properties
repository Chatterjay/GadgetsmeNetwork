mod_description=ME Building Gadgets wires three Building Gadgets 2 tools into Applied Energistics 2: Copy-Paste, Building and Exchanging gadgets, each crafted from its vanilla counterpart plus a Wireless Access Point.\nBind any of them to your ME network and use them as usual: when materials run short, every shortage that has a pattern is ordered through AE2's native crafting screens - chained one by one and confirmed manually by you.\nWhile placing blocks, materials are pulled straight from the network, so ordering and building work hand in hand.\nOrdering needs a wireless terminal anywhere on you. Verbose diagnostic logging is available behind the debugLog config flag.
